name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

env:
  GOPRIVATE: github.com/team-telnyx/telnyx-go/v4,github.com/stainless-sdks/telnyx-go/v4

jobs:
  classify-production-ci:
    name: classify production CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
      mode: ${{ steps.classify.outputs.mode }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: classify
        name: Classify immutable CI surface
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/classify_production_ci.py --event-path "$GITHUB_EVENT_PATH"

  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ${{ github.repository == 'stainless-sdks/telnyx-cli' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    needs: classify-production-ci
    if: needs.classify-production-ci.outputs.run_full == 'true'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate release gate policy
        run: |
          python3 .github/scripts/test_release_pr_auto_merge.py -v
          python3 .github/scripts/test_release_pr_ci_gate.py -v
          python3 .github/scripts/test_classify_production_ci.py -v
          python3 .github/scripts/test_validate_next_provenance.py -v
          python3 .github/scripts/test_verify_cli_release.py -v

      - uses: ./.github/actions/setup-go

      - name: Link staging branch
        if: github.repository == 'stainless-sdks/telnyx-cli'
        run: |
          ./scripts/link 'github.com/stainless-sdks/telnyx-go/v4@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint

  build:
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ github.repository == 'stainless-sdks/telnyx-cli' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    needs: classify-production-ci
    if: needs.classify-production-ci.outputs.run_full == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go

      - name: Link staging branch
        if: github.repository == 'stainless-sdks/telnyx-cli'
        run: |
          ./scripts/link 'github.com/stainless-sdks/telnyx-go/v4@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.1.0
        with:
          version: latest
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get GitHub OIDC Token
        if: |-
          github.repository == 'stainless-sdks/telnyx-cli' &&
          !startsWith(github.ref, 'refs/heads/stl/')
        id: github-oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: core.setOutput('github_token', await core.getIDToken());

      - name: Upload tarball
        if: |-
          github.repository == 'stainless-sdks/telnyx-cli' &&
          !startsWith(github.ref, 'refs/heads/stl/')
        env:
          URL: https://pkg.stainless.com/s
          AUTH: ${{ steps.github-oidc.outputs.github_token }}
          SHA: ${{ github.sha }}
        run: ./scripts/utils/upload-artifact.sh

  test:
    timeout-minutes: 10
    name: test
    runs-on: ${{ github.repository == 'stainless-sdks/telnyx-cli' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    needs: classify-production-ci
    if: needs.classify-production-ci.outputs.run_full == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go

      - name: Link staging branch
        if: github.repository == 'stainless-sdks/telnyx-cli'
        run: |
          ./scripts/link 'github.com/stainless-sdks/telnyx-go/v4@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
